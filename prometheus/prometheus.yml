global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules/*.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: application
    honor_labels: true
    file_sd_configs:
      - files: [/etc/prometheus/targets/*.json]
        refresh_interval: 15s
  - job_name: demo
    honor_labels: true
    static_configs:
      - targets: [example-nestjs:3000]
        labels: {service_name: example-nestjs, environment: local}
      - targets: [example-python:8000]
        labels: {service_name: example-python, environment: local}
